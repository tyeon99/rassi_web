g><p>수익성은 좋아 보이지만, ‘재무의 질’이 약한 종목</p></div><div class="right"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M7.5 12.75L11.25 9L7.5 5.25" stroke="#D3D3D3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></div></button><button class="list"><div class="left"><strong>저퀄리티</strong><p>재무제표상 수익성과 건전성이 모두 낮은 종목</p></div><div class="right"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M7.5 12.75L11.25 9L7.5 5.25" stroke="#D3D3D3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></div></button><!--]--></div></div></div><div class="itemStyleSection"><div class="title">2. 상승세와 돈의 흐름</div><div class="itemStyleSection__tab"><!--[--><button class="active">주가모멘텀</button><button class="">실적모멘텀</button><!--]--></div><div class="itemStyleSection__tabContent"><div class="list-box"><!--[--><button class="list"><div class="left"><strong>강한추세</strong><p>장·중·단기 주가 흐름이 모두 강한 상승세를 보이는 종목</p></div><div class="right"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M7.5 12.75L11.25 9L7.5 5.25" stroke="#D3D3D3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></div></button><button class="list"><div class="left"><strong>단기조정</strong><p>장기 상승 흐름은 유지되지만 최근 단기 조정이 나타난 종목</p></div><div class="right"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M7.5 12.75L11.25 9L7.5 5.25" stroke="#D3D3D3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></div></button><button class="list"><div class="left"><strong>반등초기</strong><p>장기 하락 흐름 속에서 최근 반등이 나타난 종목</p></div><div class="right"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M7.5 12.75L11.25 9L7.5 5.25" stroke="#D3D3D3" stroke-width="2" stroke-linecap="round" stroke-l
